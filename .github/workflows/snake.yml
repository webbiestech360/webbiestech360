name: Generate Snake Animation

on:
  schedule:
    - cron: "0 */12 * * *"   # runs every 12 hours
  workflow_dispatch:          # allows manual run from Actions tab
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake game SVG
        uses: Platane/snk@v3
        with:
          github_user_name: webbiestech360
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#39FF14&color_dots=#0d1117,#005c1e,#00b33c,#00ff66,#39FF14
            dist/github-contribution-grid-snake-dark.svg?color_snake=#39FF14&color_dots=#0d1117,#005c1e,#00b33c,#00ff66,#39FF14

      - name: Push output to "output" branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
