name: Generate Snake Animation

on:
  schedule:
    - cron: "0 */12 * * *"   # runs every 12 hours
  workflow_dispatch:          # allows manual run from Actions tab
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake game SVG
        uses: Platane/snk@v3
        with:
          github_user_name: webbiestech360
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=00FF41,00CC33,009926&color_dots=ebebeb,d6d6d6,c2c2c2,adadad,999999&color_dark=ebebeb

      - name: Push output to "output" branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
