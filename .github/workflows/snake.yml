name: Generate Snake Animation

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake game SVG
        uses: Platane/snk@v3
        with:
          github_user_name: webbiestech360
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#00FF66&color_dots=#0d1117,#003d1a,#006633,#00b34d,#00FF66
            dist/github-contribution-grid-snake-dark.svg?color_snake=#00FF66&color_dots=#0d1117,#003d1a,#006633,#00b34d,#00FF66

      - name: Push output to "output" branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
