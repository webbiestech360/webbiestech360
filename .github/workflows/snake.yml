name: Generate Snake Animation

on:
  schedule:
    # PKT Timings: 5:00 AM, 9:00 AM, 1:00 PM, 5:00 PM, 9:00 PM, 1:00 AM (0,4,8,12,16,20 UTC)
    - cron: "0 0,4,8,12,16,20 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    env:
      TZ: "Asia/Karachi"
    steps:
      - name: Generate snake game SVG
        uses: Platane/snk@v3
        with:
          github_user_name: webbiestech360
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#00FF66&color_dots=#161b22,#0e4429,#006d32,#26a641,#39d353
            dist/github-contribution-grid-snake-dark.svg?color_snake=#00FF66&color_dots=#161b22,#0e4429,#006d32,#26a641,#39d353

      - name: Push output to "output" branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
