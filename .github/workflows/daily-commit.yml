name: Random Activity Generator

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:

jobs:
  auto-commit:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Random Multiple Commits
        run: |
          git config --local user.email "276072756+webbiestech360@users.noreply.github.com"
          git config --local user.name "webbiestech360"

          NUM_COMMITS=$(( ( RANDOM % 8 ) + 1 ))
          echo "Generating $NUM_COMMITS commits..."

          for i in $(seq 1 $NUM_COMMITS); do
            echo "Matrix Activity: $(date) - Loop $i" >> activity.log
            git add activity.log
            git commit -m "chore(matrix): sync log $i" || true
            sleep 1
          done

          git push
